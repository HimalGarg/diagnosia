[pytest]
testpaths = backend/tests
addopts = -m "not live and not local_stack"
markers =
    live: calls a real external service. Needs DIAGNOSIA_LIVE_TESTS=1 or DIAGNOSIA_LIVE_INTEGRATIONS=1, and uses synthetic data only.
    local_stack: uses local stand-in servers in Docker. These are never live results. Needs LOCAL_MONGODB_URI or LOCAL_POSTGRES_DSN.
