# Optional local servers for trying the integrations. The app doesn't need these to run.
# Synthetic data only. Atlas and a real YugabyteDB cluster replace them in any shared environment.
services:
  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]  # a replica set, because change streams need one
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok }"
      interval: 5s
      retries: 20
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false"]
    ports: ["127.0.0.1:5433:5433"]
